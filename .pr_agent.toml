[github_app]
handle_push_trigger = true
push_commands = [
    "/agentic_review"
]

[pr_code_suggestions]
enable_chat_in_code_suggestions = true

[config]
allow_only_specific_folders=['lib', 'example', 'test', '.github']

[review_agent]
issues_user_guidelines = """
Project Type:
- Flutter package/library
- Production-ready reusable SDK

Architecture:
- Use clean architecture principles when applicable
- Keep public API simple and minimal
- Separate public API from internal implementation
- Internal implementation must be hidden whenever possible
- Prefer inheritance over composition
- Avoid tight coupling between modules

Package Structure:
- lib/
  - src/
    - internal implementation only
  - package_name.dart = public exports only

Rules:
- Never expose src/ directly to consumers
- Export only stable APIs from package_name.dart
- Keep breaking changes minimal
- Avoid unnecessary dependencies
- Prefer pure Dart when possible
- Flutter dependency should only exist if UI/platform features are required

Code Style:
- Use immutable models whenever possible
- Prefer final fields
- Prefer const constructors
- Prefer small focused classes/functions
- Avoid god classes
- Avoid deeply nested widgets
- Use meaningful naming
- Avoid duplicated logic
- Keep files focused and small

State Management:
- Do not enforce specific state management unless required
- Package should work with Bloc, Riverpod, Provider, GetX, etc.
- Avoid coupling SDK to UI frameworks
- Business logic should be framework agnostic

Async Rules:
- Use async/await properly
- Avoid unhandled Futures
- Never block UI thread
- Always handle timeout and exception scenarios

Error Handling:
- Never swallow exceptions silently
- Provide meaningful exception messages
- Expose typed exceptions when appropriate
- Use Result wrapper or sealed result pattern for SDK responses
- Validate parameters early

Platform Channel Rules:
- Minimize platform channel calls
- Prefer batching over frequent bridge communication
- Handle platform exceptions safely
- Keep Android/iOS implementations consistent
- Avoid memory leaks in platform code

Android Rules:
- Use Kotlin
- Avoid Context leaks
- Avoid GlobalScope
- Use lifecycle-aware components
- Prefer suspend functions and Flow
- Support latest stable Android SDK

iOS Rules:
- Use Swift
- Avoid force unwraps
- Use weak references when needed
- Ensure thread safety
- Support latest stable iOS version

Performance:
- Minimize rebuilds
- Avoid unnecessary allocations
- Avoid excessive object creation
- Cache expensive operations safely
- Lazy load when possible
- Avoid reflection unless necessary

Security:
- Never hardcode secrets
- Validate all external input
- Sanitize platform communication
- Use secure cryptography practices
- Avoid insecure random generators
- Sensitive data must be encrypted when appropriate

Public API Rules:
- Use CryptoVault as a Library Name
- Public API must be documented
- Avoid exposing experimental APIs directly
- Prefer backward compatibility
- Keep naming predictable
- Public methods/classes require DartDoc

Testing:
- Write unit tests for public API
- Mock platform dependencies
- Avoid flaky tests
- Ensure deterministic test behavior
- Test public APIs

Documentation:
- Every public class/function needs documentation
- Provide README usage examples
- Add migration guide for breaking changes
- Document platform setup clearly
- Include minimal reproducible examples

Dependency Rules:
- Keep dependency count minimal
- Avoid abandoned packages
- Prefer official/stable libraries
- Do not add heavy dependency for small functionality
- Evaluate transitive dependency impact

CI/CD:
- Ensure package passes analyze
- Ensure package passes tests
- Ensure formatting is clean
- Ensure pub publish dry-run passes

Pub.dev Rules:
- Maintain high pub points
- Provide complete example app
- Include screenshots if UI related
- Avoid warnings during publish
"""
